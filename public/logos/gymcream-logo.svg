<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- GYM CREAM Logo SVG -->
  <rect width="400" height="100" fill="transparent"/>
  
  <!-- Icon Symbol: Dumbbell + Ice Cream Cone Hybrid -->
  <g transform="translate(15, 15)">
    <!-- Dumbbell weight left -->
    <rect x="5" y="15" width="10" height="40" rx="3" fill="#FFE500" />
    <rect x="18" y="22" width="6" height="26" rx="2" fill="#FFE500" />
    
    <!-- Bar -->
    <rect x="24" y="32" width="22" height="6" fill="#FFE500" />
    
    <!-- Dumbbell weight right -->
    <rect x="46" y="22" width="6" height="26" rx="2" fill="#FFE500" />
    <rect x="55" y="15" width="10" height="40" rx="3" fill="#FFE500" />
    
    <!-- Ice Cream Drip Crown on bar -->
    <path d="M 20 20 Q 35 5, 50 20 Q 42 30, 35 25 Q 28 32, 20 20 Z" fill="#FFFFFF" />
  </g>
  
  <!-- Typography GYM CREAM -->
  <text x="95" y="58" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="2" fill="#FFFFFF">
    GYM<tspan fill="#FFE500">CREAM</tspan>
  </text>
  
  <text x="97" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="5" fill="#A1A1AA">
    APPAREL &amp; IRONY
  </text>
</svg>
